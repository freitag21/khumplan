<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>คุ้มแพลน (KhumPlan) — วิเคราะห์ Protection Gap</title>
    <meta name="description" content="เครื่องมือสำหรับตัวแทนประกัน: คัดกรองผู้มุ่งหวัง (MANHA) และวิเคราะห์ช่องว่างความคุ้มครองของลูกค้าเป็นอินโฟกราฟิก" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // ตั้ง theme ก่อนวาดหน้า เพื่อไม่ให้จอกระพริบ
      try {
        var _t = localStorage.getItem('khumplan-theme');
        if (_t === 'dark' || _t === 'light') document.documentElement.dataset.theme = _t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
